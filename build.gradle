plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"gaia-earth" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		selftest {
			server()
			name "Self-test Server"
			vmArg "-Drealearth.selftest=true"
			vmArg "-Drealearth.selftestOnly=${project.findProperty('only') ?: ''}"
			runDir "run-selftest"
		}
		selftestEarthType {
			server()
			name "Self-test Server (Earth world type)"
			vmArg "-Drealearth.selftest=true"
			runDir "run-selftest-earthtype"
		}
		playtest {
			client()
			name "Play Test"
			vmArg "-Drealearth.playtest=${project.findProperty('place') ?: '59.3293,18.0686'}"
			vmArg "-Drealearth.flight=${project.findProperty('flight') ?: ''}"
			programArgs "--quickPlaySingleplayer", "${project.findProperty('world') ?: 'playtest'}"
			runDir "run-shots"
		}
		clean {
			client()
			name "Clean Client (no other mods)"
			vmArg "-Drealearth.shots=true"
			vmArg "-Drealearth.shotList=towns"
			vmArg "-Drealearth.shotTicks=900"
			vmArg "-Drealearth.shotOnly=${project.findProperty('shotOnly') ?: 'fagersjo,city-street'}"
			programArgs "--quickPlaySingleplayer", "clean", "--width", "1920", "--height", "1080"
			runDir "run-clean"
		}
		shots {
			client()
			name "Screenshot Tour"
			vmArg "-Drealearth.shots=true"
			vmArg "-Drealearth.shotList=${project.findProperty('shotList') ?: 'places'}"
			vmArg "-Drealearth.shotTicks=${project.findProperty('shotTicks') ?: 600}"
			vmArg "-Drealearth.dhValidate=true"
			vmArg "-Drealearth.lodCanopy=${project.findProperty('lodCanopy') ?: 'true'}"
			vmArg "-Drealearth.shotOnly=${project.findProperty('shotOnly') ?: ''}"
			vmArg "-Drealearth.shotHud=${project.findProperty('shotHud') ?: 'false'}"
			programArgs "--quickPlaySingleplayer", "earthtest", "--width", "1920", "--height", "1080"
			runDir "run-shots"
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	xaero {
		transitive = false
	}
	compileOnly.extendsFrom xaero
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional mods, compiled against and never shipped, from Modrinth: Distant Horizons for level-of-detail
	// terrain, Jade and Xaero's Minimap and World Map for what the mod shows in them.
	compileOnly "maven.modrinth:distanthorizons:3.3.3-26.1.2"
	compileOnly "maven.modrinth:jade:26.1.9+fabric"
	xaero "maven.modrinth:xaeros-minimap:fabric-26.1.2-26.6.1"
	xaero "maven.modrinth:xaeros-world-map:fabric-26.1.2-1.47.2"
	// xaerolib is published only inside Xaero's mods (META-INF/jars): the minimap's copy.
	compileOnly files(zipTree(configurations.xaero.find { it.name.startsWith("xaeros-minimap") }).matching { include "META-INF/jars/*.jar" })
}

// runClient with Xaero's Minimap and World Map (each brings its own xaerolib).
loom.runs.client.vmArg "-Dfabric.addMods=${configurations.xaero.asPath}"

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The data sources' licences ask for attribution wherever the mod is passed on.
jar {
	from("CREDITS.md", "LICENSE")
}
