plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"gaia-earth" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		selftest {
			server()
			name "Self-test Server"
			vmArg "-Drealearth.selftest=true"
			vmArg "-Drealearth.selftestOnly=${project.findProperty('only') ?: ''}"
			runDir "run-selftest"
		}
		selftestEarthType {
			server()
			name "Self-test Server (Earth world type)"
			vmArg "-Drealearth.selftest=true"
			runDir "run-selftest-earthtype"
		}
		playtest {
			client()
			name "Play Test"
			vmArg "-Drealearth.playtest=${project.findProperty('place') ?: '59.3293,18.0686'}"
			vmArg "-Drealearth.flight=${project.findProperty('flight') ?: ''}"
			programArgs "--quickPlaySingleplayer", "${project.findProperty('world') ?: 'playtest'}"
			runDir "run-shots"
		}
		clean {
			client()
			name "Clean Client (required mods only)"
			vmArg "-Drealearth.shots=true"
			vmArg "-Drealearth.shotList=towns"
			vmArg "-Drealearth.shotTicks=900"
			vmArg "-Drealearth.shotOnly=${project.findProperty('shotOnly') ?: 'fagersjo,city-street'}"
			programArgs "--quickPlaySingleplayer", "clean", "--width", "1920", "--height", "1080"
			runDir "run-clean"
		}
		shots {
			client()
			name "Screenshot Tour"
			vmArg "-Drealearth.shots=true"
			vmArg "-Drealearth.shotList=${project.findProperty('shotList') ?: 'places'}"
			vmArg "-Drealearth.shotTicks=${project.findProperty('shotTicks') ?: 600}"
			vmArg "-Drealearth.dhValidate=true"
			vmArg "-Drealearth.lodCanopy=${project.findProperty('lodCanopy') ?: 'true'}"
			vmArg "-Drealearth.shotOnly=${project.findProperty('shotOnly') ?: ''}"
			vmArg "-Drealearth.shotHud=${project.findProperty('shotHud') ?: 'false'}"
			programArgs "--quickPlaySingleplayer", "earthtest", "--width", "1920", "--height", "1080"
			runDir "run-shots"
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	clientMenu {
		transitive = false
		canBeConsumed = false
	}
	clientPerformance {
		transitive = false
		canBeConsumed = false
	}
	xaero {
		transitive = false
	}
	compileOnly.extendsFrom xaero
	clientCompileOnly.extendsFrom clientMenu
}

def clientRequirements = tasks.register("clientRequirementsJar", Jar) {
	archiveFileName = "gaia-earth-client.jar"
	destinationDirectory = layout.buildDirectory.dir("client-requirements")
	from("src/clientRequirements")
	from("src/main/resources/assets/gaia-earth/icon.png")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional mods, compiled against and never shipped, from Modrinth: Distant Horizons for level-of-detail
	// terrain, Jade and Xaero's Minimap and World Map for what the mod shows in them.
	compileOnly "maven.modrinth:distanthorizons:3.3.3-26.1.2"
	compileOnly "maven.modrinth:jade:26.1.9+fabric"
	xaero "maven.modrinth:xaeros-minimap:fabric-26.1.2-26.6.1"
	xaero "maven.modrinth:xaeros-world-map:fabric-26.1.2-1.47.2"
	// xaerolib is published only inside Xaero's mods (META-INF/jars): the minimap's copy.
	compileOnly files(zipTree(configurations.xaero.find { it.name.startsWith("xaeros-minimap") }).matching { include "META-INF/jars/*.jar" })

	// The metadata JAR lets Fabric enforce Sodium on clients while accepting dedicated servers.
	runtimeOnly files(clientRequirements)
	clientRuntimeOnly "maven.modrinth:sodium:mc26.1.1-0.8.9-fabric"

	// Optional development-client mods.
	clientPerformance "maven.modrinth:lithium:mc26.1.2-0.24.7-fabric"
	clientPerformance "maven.modrinth:ferrite-core:9.0.0-fabric"
	clientMenu "maven.modrinth:modmenu:18.0.2"
}

// Keep the clean client free of optional mods.
def performanceMods = providers.gradleProperty("noPerformanceMods").isPresent() ? [] : configurations.clientPerformance.files.toList()
def playtestMods = configurations.clientMenu.files.toList() + performanceMods
def clientMods = configurations.xaero.files.toList() + playtestMods
loom.runs.client.vmArg "-Dfabric.addMods=${clientMods.join(File.pathSeparator)}"
loom.runs.playtest.vmArg "-Dfabric.addMods=${playtestMods.join(File.pathSeparator)}"

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The data sources' licences ask for attribution wherever the mod is passed on.
jar {
	from("CREDITS.md", "LICENSE")
	from(clientRequirements) {
		into("META-INF/jars")
	}
}
